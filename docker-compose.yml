services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dominote_api
    ports:
      - "8080:8080"
    environment:
      - GIN_MODE=release
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=dominote
      - DB_PASSWORD=dominote_pass
      - DB_NAME=dominote_db
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: dominote_db
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=dominote
      - POSTGRES_PASSWORD=dominote_pass
      - POSTGRES_DB=dominote_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dominote -d dominote_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
